<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark theme background -->
  <rect width="32" height="32" rx="6" fill="#0a0e27"/>
  
  <!-- Border with cyan glow -->
  <rect width="32" height="32" rx="6" fill="none" stroke="#00ffff" stroke-width="1.5" opacity="0.9"/>
  
  <!-- Upward arrow (trading up) -->
  <path d="M 16 8 L 16 22 M 12 18 L 16 22 L 20 18" stroke="#00ffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Dollar sign -->
  <circle cx="16" cy="16" r="8" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
  <text x="16" y="18" font-size="10" font-weight="bold" fill="#00ffff" text-anchor="middle" font-family="monospace">$</text>
</svg>
